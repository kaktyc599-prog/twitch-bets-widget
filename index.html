<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>OBS Bets Overlay (Splicer_IRL) — ставки на баллы канала</title>

    <!--
        ================================================================
        ВИДЖЕТ ДЛЯ OBS (Splicer_IRL)
        ================================================================
        Показывает активные ставки на баллы канала (Twitch Predictions):

            ┌────────────────────────────────────────┐
            │  СТАВКА                    осталось 1:23│
            │  Кто победит в сегодняшнем матче?       │
            │  ● Вариант 1        ● Вариант 2         │
            │   12.4K (40%)       18.7K (60%)         │
            │  [===== СИНИЙ | КРАСНЫЙ ==========]     │
            └────────────────────────────────────────┘

        НАСТРОЙКА:
        1. Получи токен (см. get-token.html или README.md).
        2. Добавь в OBS источник "Браузер" с локальным файлом index.html.
        3. Параметры URL (необязательно):
           ?token=ТОКЕН              — access-токен Twitch (сохраняется в память браузера OBS)
           &channel=Splicer_IRL      — канал (по умолчанию Splicer_IRL)
           &scale=1                  — масштаб карточки (0.5 .. 2)
           &after=60                 — секунд показывать результат после завершения (0 = не скрывать)
           &idle=hide                — полностью скрыть карточку, когда нет активной ставки
           &poll=3                   — интервал опроса API в секундах
           &demo=1                   — тестовый режим без токена (фальшивая ставка)

        Пример:
        ...\bets\index.html?token=abc123&scale=1.1
        ================================================================
    -->

    <style>
        /* ============================================================
           Переменные стиля (правь здесь, если хочешь поменять оформление)
           ============================================================ */
        :root {
            --card-bg: rgba(7, 10, 9, 0.78);        /* фон карточки */
            --card-radius: 16px;                    /* скругление углов */
            --card-width: 640px;                    /* ширина карточки */
            --font-size: 20px;                      /* базовый размер шрифта */
            --accent: #b96bff;                      /* фиолетовый акцент бейджа */
            --green: #00ff9d;                       /* вариант 1 (зелёный) */
            --purple: #b96bff;                      /* вариант 2 (фиолетовый) */
            /* Легаси-алиасы: классы в разметке исторически названы blue/red,
               фактические цвета — зелёный и фиолетовый */
            --blue: var(--green);
            --red: var(--purple);
            --text: #ffffff;
            --text-dim: #9aa3b2;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }

        body {
            background: transparent;                 /* прозрачный фон под OBS */
            color: var(--text);
            font-family: 'Inter', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            font-size: var(--font-size);
            overflow: hidden;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        /* ==================== Карточка ставки ==================== */
        #card {
            width: var(--card-width);
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            border-radius: var(--card-radius);
            box-shadow:
                0 10px 34px rgba(0, 0, 0, 0.55),
                0 0 26px rgba(0, 255, 157, 0.07),
                0 0 44px rgba(185, 107, 255, 0.10);
            padding: 16px 20px 18px;
            border: 1px solid rgba(160, 255, 210, 0.14);
            transition: opacity 0.45s ease, transform 0.45s ease;
            opacity: 0;                              /* прячем, пока нет данных */
            transform: translateY(-12px);
        }

        #card.visible { opacity: 1; transform: translateY(0); }
        #card.hidden { opacity: 0; transform: translateY(-12px); pointer-events: none; }

        /* ==================== Шапка: бейдж + таймер ==================== */
        #head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        #badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #d2a8ff;
            background: rgba(185, 107, 255, 0.16);
            border: 1px solid rgba(185, 107, 255, 0.45);
            box-shadow: 0 0 14px rgba(185, 107, 255, 0.30), inset 0 0 10px rgba(185, 107, 255, 0.10);
            padding: 4px 12px;
            border-radius: 999px;
        }

        #badge::before {
            content: '';
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--purple);
            box-shadow: 0 0 9px var(--purple), 0 0 16px var(--purple);
            animation: pulse 1.6s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.35; transform: scale(0.75); }
        }

        #timer {
            font-size: 14px;
            font-weight: 700;
            color: #d6fff0;
            background: rgba(0, 255, 157, 0.08);
            border: 1px solid rgba(0, 255, 157, 0.35);
            box-shadow: 0 0 12px rgba(0, 255, 157, 0.22), inset 0 0 8px rgba(0, 255, 157, 0.06);
            padding: 4px 12px;
            border-radius: 999px;
            font-variant-numeric: tabular-nums;      /* цифры не "прыгают" */
        }

        /* последние 3 секунды приёма ставок — таймер мигает фиолетовым */
        #timer.urgent {
            color: #e5c6ff;
            background: rgba(185, 107, 255, 0.20);
            border-color: rgba(185, 107, 255, 0.75);
            animation: timerBlink 0.55s ease-in-out infinite;
        }

        @keyframes timerBlink {
            0%, 100% {
                opacity: 1;
                box-shadow: 0 0 18px rgba(185, 107, 255, 0.75), inset 0 0 10px rgba(185, 107, 255, 0.25);
            }
            50% {
                opacity: 0.30;
                box-shadow: 0 0 4px rgba(185, 107, 255, 0.25);
            }
        }

        /* ==================== Вопрос (градиентный неон-текст) ==================== */
        #title {
            font-size: 26px;
            font-weight: 800;
            line-height: 1.25;
            margin: 2px 0 12px;
            background: linear-gradient(92deg, #8fffd9 0%, #ffffff 45%, #d9aaff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 14px rgba(0, 255, 157, 0.22)) drop-shadow(0 1px 3px rgba(0, 0, 0, 0.65));
        }

        /* ==================== Варианты ответов ==================== */
        #outcomes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .outcome {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 10px 14px 12px;
            border-radius: 12px;
            border-top: 3px solid transparent;
            background: rgba(255, 255, 255, 0.04);
            transition: opacity 0.5s ease, filter 0.5s ease, transform 0.3s ease, box-shadow 0.4s ease;
        }

        .outcome .o-name {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 18px;
            /* overflow УБРАЛИ — иначе прямоугольная обрезка съедала глоу точки */
            min-width: 0;
        }

        /* многоточие для длинных названий — на вложенном span,
           чтобы свечение точки (box-shadow до ::before) не резалось */
        .outcome .o-name > span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }

        .outcome .o-name::before {
            content: '';
            width: 10px; height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .outcome .o-pts {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-dim);
            font-variant-numeric: tabular-nums;
        }

        .outcome.blue {
            border-top-color: var(--green);
            background: linear-gradient(180deg, rgba(0, 255, 157, 0.12), rgba(0, 255, 157, 0.02) 70%);
            box-shadow: 0 0 16px -4px rgba(0, 255, 157, 0.45), inset 0 0 18px rgba(0, 255, 157, 0.06);
        }
        .outcome.blue .o-name::before {
            background: var(--green);
            box-shadow: 0 0 8px var(--green), 0 0 15px var(--green);
        }
        .outcome.blue .o-pts strong { color: #74ffcf; text-shadow: 0 0 10px rgba(0, 255, 157, 0.55); }

        .outcome.red {
            border-top-color: var(--purple);
            background: linear-gradient(180deg, rgba(185, 107, 255, 0.14), rgba(185, 107, 255, 0.02) 70%);
            box-shadow: 0 0 16px -4px rgba(185, 107, 255, 0.45), inset 0 0 18px rgba(185, 107, 255, 0.07);
        }
        .outcome.red .o-name::before {
            background: var(--purple);
            box-shadow: 0 0 8px var(--purple), 0 0 15px var(--purple);
        }
        .outcome.red .o-pts strong { color: #d5aaff; text-shadow: 0 0 10px rgba(185, 107, 255, 0.60); }

        /* Проигравший вариант тускнеет после результата */
        .outcome.loser { opacity: 0.35; filter: saturate(0.4); transform: scale(0.985); box-shadow: none; }
        .outcome.winner {
            animation: winPop 0.5s ease, winGlow 2.2s ease-in-out infinite 0.6s;
        }

        /* фиолетовое свечение, если победил второй вариант */
        .outcome.red.winner {
            animation: winPop 0.5s ease, winGlowP 2.2s ease-in-out infinite 0.6s;
        }

        @keyframes winGlowP {
            0%, 100% { box-shadow: 0 0 18px -2px rgba(185, 107, 255, 0.55), inset 0 0 20px rgba(185, 107, 255, 0.12); }
            50%      { box-shadow: 0 0 30px 2px rgba(185, 107, 255, 0.80), inset 0 0 26px rgba(185, 107, 255, 0.18); }
        }

        @keyframes winPop {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        /* ==================== Полоса процентов ==================== */
        #bar {
            margin-top: 12px;
            height: 8px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.06);
            box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.55);
            display: flex;
            /* glow сегментов не обрезаем: overflow visible */
        }

        #barBlue, #barRed {
            height: 100%;
            width: 50%;
            transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1);
        }

        #barBlue { background: linear-gradient(90deg, #007a52, var(--green)); box-shadow: 0 0 12px rgba(0, 255, 157, 0.65); border-radius: 999px 0 0 999px; }
        #barRed  { background: linear-gradient(90deg, #7a3ad6, var(--purple)); box-shadow: 0 0 12px rgba(185, 107, 255, 0.65); border-radius: 0 999px 999px 0; }

        /* ==================== Сообщение-баннер (результат/ошибка) ==================== */
        #banner {
            margin-top: 10px;
            text-align: center;
            font-weight: 800;
            font-size: 18px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        #banner.show { opacity: 1; }
        #banner.win.win-green { color: #7dffd0; text-shadow: 0 0 16px rgba(0, 255, 157, 0.75), 0 0 30px rgba(0, 255, 157, 0.40); }
        #banner.win.win-purple { color: #d5aaff; text-shadow: 0 0 16px rgba(185, 107, 255, 0.80), 0 0 30px rgba(185, 107, 255, 0.45); }
        #banner.cancel { color: #ffd166; text-shadow: 0 0 12px rgba(255, 209, 102, 0.45); }
        #banner.error, #banner.lock { color: var(--text-dim); font-weight: 600; font-size: 15px; }

        /* ==================== Экран ошибки ==================== */
        #err {
            display: none;
            position: absolute;
            left: 12px; bottom: 12px;
            font-size: 13px;
            color: #ff8080;
            background: rgba(0, 0, 0, 0.65);
            padding: 8px 14px;
            border-radius: 10px;
            max-width: 90%;
            z-index: 10;
        }
        #err.show { display: block; }
    </style>
</head>
<body>

    <div id="card">
        <div id="head">
            <span id="badge">Ставка</span>
            <span id="timer"></span>
        </div>

        <div id="title">—</div>

        <div id="outcomes">
            <div class="outcome blue" id="oBlue">
                <div class="o-name"><span id="bTitle">—</span></div>
                <div class="o-pts"><strong id="bPts">0 (50%)</strong></div>
            </div>
            <div class="outcome red" id="oRed">
                <div class="o-name"><span id="rTitle">—</span></div>
                <div class="o-pts"><strong id="rPts">0 (50%)</strong></div>
            </div>
        </div>

        <div id="bar">
            <div id="barBlue"></div>
            <div id="barRed"></div>
        </div>

        <div id="banner"></div>
    </div>

    <div id="err"></div>

    <script>
        /* ============================================================
           Настройки по умолчанию (меняются параметрами URL)
           ============================================================ */
        const DEFAULT_CHANNEL = 'Splicer_IRL';   // канал по умолчанию
        const DEFAULT_POLL_SEC = 3;              // опрос API, когда ставка активна
        const IDLE_POLL_SEC = 10;                // опрос API, когда ставки нет

        /* Безопасная обёртка localStorage (работает и там, где хранилище запрещено, — file://, OBS и т.п.) */
        const store = {
            get(k)    { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
            set(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} },
            del(k)    { try { window.localStorage.removeItem(k); } catch (e) {} },
        };

        /* ============================================================
           Чтение параметров URL + хранение токена в памяти OBS-браузера
           ============================================================ */
        const qs = new URLSearchParams(location.search);

        // Токен и client_id можно передать в URL или сохранить там навсегда
        let TOKEN = qs.get('token') || store.get('bets_token') || '';
        let CLIENT_ID = qs.get('client_id') || store.get('bets_client_id') || '';
        if (qs.get('token')) {
            // сохраняем токен, чтобы OBS-URL можно было использовать короткий
            store.set('bets_token', TOKEN);
            try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {}
        }
        if (qs.get('client_id')) store.set('bets_client_id', CLIENT_ID);

        const CHANNEL = (qs.get('channel') || DEFAULT_CHANNEL).toLowerCase();
        const SCALE = Math.min(3, Math.max(0.4, parseFloat(qs.get('scale')) || 1));
        const AFTERForResultSec = parseFloat(qs.get('after') ?? '60');   // показ результата
        const HIDE_WHEN_IDLE = qs.get('idle') === 'hide';
        const POLL_SEC = Math.max(2, parseFloat(qs.get('poll')) || DEFAULT_POLL_SEC);
        const DEMO = qs.get('demo') === '1';   // тестовый режим без токена (фальшивые данные)

        document.documentElement.style.zoom = SCALE;

        /* ============================================================
           Ссылки на элементы
           ============================================================ */
        const el = id => document.getElementById(id);
        const card = el('card'), title = el('title'), timer = el('timer');
        const badge = el('badge');
        const bTitle = el('bTitle'), rTitle = el('rTitle');
        const bPts = el('bPts'), rPts = el('rPts');
        const oBlue = el('oBlue'), oRed = el('oRed');
        const barBlue = el('barBlue'), barRed = el('barRed');
        const banner = el('banner'), errBox = el('err');

        function showErr(msg) {
            console.error('[bets]', msg);
            errBox.textContent = String(msg);
            errBox.classList.add('show');
        }
        function hideErr() { errBox.classList.remove('show'); }

        function showBanner(text, cls = '', ms = 0) {
            banner.className = '';
            banner.textContent = text;
            banner.classList.add('show');
            // можно передать несколько классов через пробел: 'win win-green'
            String(cls).split(/\s+/).filter(Boolean).forEach(c => banner.classList.add(c));
            if (ms > 0) setTimeout(() => { if (banner.textContent === text) banner.classList.remove('show'); }, ms);
        }

        /* ============================================================
           Форматирование
           ============================================================ */
        // 12345 -> 12.3K ; 1234567 -> 1.2M
        function fmtNum(n) {
            n = n || 0;
            if (n >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
            if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
            if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
            return String(n);
        }

        function fmtTime(sec) {
            sec = Math.max(0, Math.floor(sec));
            const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
            if (h > 0) return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
            return m + ':' + String(s).padStart(2, '0');
        }

        /* ============================================================
           Twitch Helix API
           ============================================================ */
        let broadcasterId = store.get('bets_broadcaster_' + CHANNEL) || '';

        async function helix(path, attempt = 1) {
            if (!TOKEN) throw new Error('Нет токена — см. get-token.html / README.md');
            if (!CLIENT_ID) throw new Error('Нет client_id — см. get-token.html / README.md');
            const url = 'https://api.twitch.tv/helix/' + path;
            const resp = await fetch(url, {
                headers: {
                    'Authorization': 'Bearer ' + TOKEN,
                    'Client-Id': CLIENT_ID,
                },
            });
            if (resp.status === 401) {
                if (attempt === 1) {
                    // токен мог "устать" (временный сбой) — вторая попытка сразу
                    return helix(path, attempt + 1);
                }
                store.del('bets_token');
                TOKEN = '';
                showBanner('Токен истёк — обнови URL (см. get-token.html)', 'error');
                throw new Error('401 Unauthorized — токен недействителен');
            }
            if (resp.status === 403) throw new Error('Нет доступа (нужен токен стримера со scope channel:read:predictions)');
            if (resp.status === 429) throw new Error('Слишком много запросов (429), увеличь &poll=');
            if (!resp.ok) throw new Error('Helix ' + resp.status);
            return resp.json();
        }

        async function resolveBroadcaster() {
            if (broadcasterId) return broadcasterId;
            const data = await helix('users?login=' + encodeURIComponent(CHANNEL));
            if (!data.data || !data.data.length) throw new Error('Канал "' + CHANNEL + '" не найден');
            broadcasterId = data.data[0].id;
            store.set('bets_broadcaster_' + CHANNEL, broadcasterId);
            return broadcasterId;
        }

        async function fetchPrediction() {
            const bid = await resolveBroadcaster();
            // первая запись = самая свежая ставка
            const data = await helix('predictions?broadcaster_id=' + bid);
            return (data.data && data.data[0]) || null;
        }

        /* ============================================================
           Отрисовка ставки
           ============================================================ */
        let currentPrediction = null;      // последняя отрис. ставка
        let resultTimer = null;            // таймер скрытия результата
        let renderTimer = null;            // таймер обновления секунда->секунда

        function renderPrediction(p) {
            if (!p) return;
            currentPrediction = p;

            clearTimeout(resultTimer);
            banner.className = '';
            banner.textContent = '';

            // вопрос
            title.textContent = p.title || 'Ставка';

            // варианты: Twitch отдаёт BLUE и PINK(красный); сортируем синий -> красный
            const outcomes = [...(p.outcomes || [])];
            const blue = outcomes.find(o => (o.color || '').toUpperCase() === 'BLUE') || outcomes[0];
            const red = outcomes.find(o => (o.color || '').toUpperCase() !== 'BLUE') || outcomes[1];

            const bp = blue ? (blue.channel_points | 0) : 0;
            const rp = red ? (red.channel_points | 0) : 0;
            const total = bp + rp;
            const bShare = total > 0 ? (bp / total) * 100 : 50;
            const rShare = total > 0 ? (rp / total) * 100 : 50;

            oBlue.classList.remove('winner', 'loser');
            oRed.classList.remove('winner', 'loser');
            oBlue.querySelector('.o-name span').textContent = blue ? blue.title : 'Вариант 1';
            oRed.querySelector('.o-name span').textContent = red ? red.title : 'Вариант 2';
            // коэффициент возврата ставки: во сколько раз вернётся пул при победе этой стороны
            const coeffTxt = pts => pts > 0 ? ' ×' + (total / pts).toFixed(2).replace(/\.?0+$/, '') : '';
            bPts.textContent = fmtNum(bp) + ' (' + Math.round(bShare) + '%)' + coeffTxt(bp);
            rPts.textContent = fmtNum(rp) + ' (' + Math.round(rShare) + '%)' + coeffTxt(rp);
            barBlue.style.width = bShare + '%';
            barRed.style.width = rShare + '%';

            const status = (p.prediction_status || p.status || 'ACTIVE').toUpperCase();
            timer.style.display = '';

            if (status === 'ACTIVE') {
                badge.textContent = 'Ставка';
                // таймер до авто-закрытия
                const endsMs = Date.parse(p.ends_at);
                const update = () => {
                    const left = (endsMs - Date.now()) / 1000;
                    timer.textContent = left > 0 ? 'осталось ' + fmtTime(left) : 'закрывается…';
                    // последние 3 секунды — мигание фиолетовым
                    timer.classList.toggle('urgent', left <= 3 && left > 0);
                };
                update();
                clearInterval(renderTimer);
                renderTimer = setInterval(update, 1000);
            } else if (status === 'LOCKED') {
                badge.textContent = 'Закрыто';
                timer.classList.remove('urgent');
                timer.textContent = 'приём ставок окончен';
                clearInterval(renderTimer);
            } else if (status === 'RESOLVED') {
                badge.textContent = 'Результат';
                timer.style.display = 'none';
                clearInterval(renderTimer);
                const winIdx = (p.winning_outcome_id || '');
                const blueWon = blue && blue.id === winIdx;
                oBlue.classList.add(blueWon ? 'winner' : 'loser');
                oRed.classList.add(blueWon ? 'loser' : 'winner');
                const winPts = blueWon ? bp : rp;
                // коэффициент возврата: общий пул / баллы победившей стороны
                const coeff = winPts > 0 ? total / winPts : 0;
                const coeffStr = winPts > 0
                    ? ' (×' + coeff.toFixed(2).replace(/\.?0+$/, '') + ')'
                    : '';
                showBanner(
                    'Победа ' + (blueWon ? 'зелёных' : 'фиолетовых') + ' — ' + fmtNum(winPts) + ' баллов' + coeffStr,
                    blueWon ? 'win win-green' : 'win win-purple'
                );
                // скрываем карточку через AFTERForResultSec (0 = держать всегда)
                if (AFTERForResultSec > 0 && !DEMO) {
                    resultTimer = setTimeout(() => { setVisibility(false); }, AFTERForResultSec * 1000);
                }
            } else if (status === 'CANCELED') {
                badge.textContent = 'Отмена';
                timer.style.display = 'none';
                clearInterval(renderTimer);
                oBlue.classList.add('loser');
                oRed.classList.add('loser');
                showBanner('Ставка отменена — баллы возвращены', 'cancel', 4000);
                if (AFTERForResultSec > 0) {
                    resultTimer = setTimeout(() => { setVisibility(false); }, Math.min(AFTERForResultSec, 20) * 1000);
                }
            }
        }

        /* ============================================================
           Показ/скрытие карточки
           ============================================================ */
        function setVisibility(visible) {
            card.classList.toggle('visible', visible);
            card.classList.toggle('hidden', !visible);
        }

        /* ============================================================
           Основной цикл опроса
           ============================================================ */
        let lastRenderedKey = null;

        async function tick() {
            try {
                hideErr();
                const p = await fetchPrediction();
                const status = p ? (p.prediction_status || '').toUpperCase() : '';
                const renderKey = p ? (p.id + ':' + status) : null;

                if (!p) {
                    // ставок вообще нет
                    if (HIDE_WHEN_IDLE) setVisibility(false);
                    else { renderEmpty(); setVisibility(true); }
                    idlePollNext(IDLE_POLL_SEC);
                    return;
                }

                if (status === 'ACTIVE' || status === 'LOCKED' ||
                    renderKey !== lastRenderedKey) {
                    // новая ставка или новый статус (в т.ч. интриги END: RESOLVED/CANCELED)
                    if (p.id !== (lastRenderedKey || '').split(':')[0]) {
                        oBlue.classList.remove('winner', 'loser');
                        oRed.classList.remove('winner', 'loser');
                    }
                    renderPrediction(p);
                    setVisibility(true);
                    lastRenderedKey = renderKey;
                    idlePollNext(status === 'ACTIVE' ? POLL_SEC : (status === 'LOCKED' ? POLL_SEC : IDLE_POLL_SEC));
                    return;
                }

                // уже отрисовано в этом статусе — ждём следующий опрос
                idlePollNext(status === 'RESOLVED' ? IDLE_POLL_SEC : POLL_SEC);
            } catch (e) {
                showErr(e.message + ' — повтор через 30 сек');
                idlePollNext(30);
            }
        }

        function idlePollNext(sec) { setTimeout(tick, sec * 1000); }

        /* ============================================================
           ДЕМО-режим (&demo=1): фальшивая ставка целиком в браузере.
           Цикл: 18 сек "Активна" -> 6 сек "Закрыто" -> 12 сек "Результат",
           победитель чередуется. Полезно проверить вид в OBS без токена.
           ============================================================ */
        const DEMO_START = Date.now();
        function demoTick() {
            hideErr();
            const t = (Date.now() - DEMO_START) / 1000;
            const phase = Math.floor(t / 36) % 4;            // полных цикл = 4 фазы
            const inPhase = t % 36;
            const base = {
                id: 'demo-' + Math.floor(t / 144),
                title: 'Кто победит в сегодняшнем челлендже?',
                prediction_status: 'ACTIVE',
                outcomes: [
                    { id: 'demo-b', title: 'Зелёная команда', color: 'BLUE', channel_points: 0 },
                    { id: 'demo-r', title: 'Фиолетовая команда', color: 'RED', channel_points: 0 },
                ],
            };
            base.ends_at = new Date(Date.now() + Math.max(0, 18 - inPhase) * 1000);
            base.outcomes[0].channel_points = Math.floor(1200 + inPhase * 360 + (phase === 3 ? 9100 : 0));
            base.outcomes[1].channel_points = Math.floor(2700 + inPhase * 240 + (phase === 3 ? 15700 : 0));

            if (inPhase < 18) {
                base.prediction_status = 'ACTIVE';
            } else if (inPhase < 24) {
                base.prediction_status = 'LOCKED';
            } else {
                base.prediction_status = 'RESOLVED';
                const blueWon = phase % 2 === 1;           // чередуем победителя
                base.winning_outcome_id = blueWon ? 'demo-b' : 'demo-r';
                if (blueWon) {
                    base.outcomes[0].channel_points += 12300;
                } else {
                    base.outcomes[1].channel_points += 23400;
                }
            }
            renderPrediction(base);
            setVisibility(true);
        }

        function renderEmpty() {
            // аккуратная пустая карточка, когда ставки нет
            currentPrediction = null;
            badge.textContent = 'Ставки';
            timer.style.display = 'none';
            title.textContent = '';
            bTitle.textContent = 'Зелёный';
            rTitle.textContent = 'Фиолетовый';
            bPts.textContent = '0 (50%)';
            rPts.textContent = '0 (50%)';
            barBlue.style.width = '50%';
            barRed.style.width = '50%';
            clearInterval(renderTimer);
            showBanner('Нет активной ставки', 'lock');
        }

        /* ============================================================
           Старт
           ============================================================ */
        // лёгкая проверка: если карточка ещё не показывали, но ставок нет и idle=hide — она просто скрыта
        if (DEMO) {
            demoTick();
            setInterval(demoTick, 1000);   // в демо-режиме тикаем каждую секунду
        } else {
            tick();
        }
    </script>
</body>
</html>
